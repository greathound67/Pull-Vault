<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#12121c;--pn:#1d1d2e;--tx:#e8e8f2;--mu:#8a8aa6}

#stage{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:0 auto}.stk{position:relative;width:240px;height:340px}#stage.multi .stk{width:150px;height:222px}#stage.multi .fr .card{font-size:10px;padding:4px}#stage.multi .pack{font-size:15px}

 const msg=`Card ${i+1} of ${P} - click ${i+1<P?'for next':'to finish'}`;if(best&&best.I.sc>=8){lockUntil=Date.now()+1000;$('rvt').textContent='...';setTimeout(()=>{if(cur==i)$('rvt').textContent=msg},1000)}else $('rvt').textContent=msg}
let lockUntil=0;
function step(){if(cur>=P||Date.now()<lockUntil)return;fls.forEach(a=>{const o=a[cur];o.classList.add('out');if(isMega)setTimeout(()=>o.remove(),320)});cur++;if(cur>=P){$('rvt').textContent='';setTimeout(summary,500)}else{if(isMega&&cur+1<P)fls.forEach((a,k)=>mk(k,cur+1));setTop(cur)}}
function summary(){const st=$('stage');st.style.display='none';st.onclick=null;$('rvb').style.display='block';rvKept={};rvPage=0;
 $('rvt').innerHTML='Pack value: <b style="color:#fbbf24;font-size:28px">'+fmt(rvCards.reduce((a,c)=>a+val(c),0))+'</b>';drawRes()}
function drawRes(){const all=[...rvCards].sort(cmp()),pc=Math.max(1,Math.ceil(all.length/40));rvPage=Math.min(rvPage,pc-1);
 const rc=$('rvc');rc.innerHTML='';rc.append(sortSel(()=>{rvPage=0;drawRes()}),pager(pc,rvPage,n=>{rvPage=n;drawRes()}));
 const g=$('rvg');g.innerHTML='';
 all.slice(rvPage*40,rvPage*40+40).forEach(c=>{const w=document.createElement('div');w.className='rw';w.appendChild(card(c));g.appendChild(w);if(c.err)return;
  const bar=document.createElement('div');bar.className='rb';w.appendChild(bar);
  if(!cardOf(c.uid)){w.classList.add('sold');bar.textContent='Sold'}else if(rvKept[c.uid]){w.classList.add('kept');bar.textContent='Kept'}
  else{const sb=document.createElement('button'),kb=document.createElement('button');sb.textContent='Sell';kb.textContent='Keep';sb.onclick=()=>{sell(c.uid,1);save();w.classList.add('sold');bar.textContent='Sold'};kb.onclick=()=>{rvKept[c.uid]=1;w.classList.add('kept');bar.textContent='Kept'};bar.append(sb,kb)}})}
$('rvDone').onclick=()=>{$('rv').classList.remove('on');render()};
$('rvSell').onclick=()=>{rvCards.forEach(c=>{if(cardOf(c.uid)&&!rvKept[c.uid])sell(c.uid,1)});$('rv').classList.remove('on');save();render()};
function sell(u,q){const c=cardOf(u);if(!c||c.lk||c.err)return;S.st.sold++;S.coins+=val(c);S.cards=S.cards.filter(x=>x.uid!=u);S.sq=S.sq.filter(x=>x!=u);if(!q){save();render()}}
function squadBest(){S.sq=S.cards.filter(c=>!c.err).sort((a,b)=>val(b)-val(a)).slice(0,S.slots).map(c=>c.uid);save();render()}
const LOCK=500/3;
function lock(u){const c=cardOf(u);if(!c||c.lk||c.err||!(S.locks>0))return;c.lk=true;S.locks--;save();render()}
function unlock(u){const c=cardOf(u);if(!c||!c.lk)return;if(confirm('Are you sure you want to unlock this card? It will be sellable again.')){c.lk=false;S.locks=(S.locks||0)+1;save();render()}}
let megaSel=0;
function megaBox(){const d=document.createElement('div');d.className='box';const cost=()=>PRICE(megaSel)*110;
 d.innerHTML=`<b>Mega Open</b><small>Open 100 packs at once. 10% fee.</small><select id="mgs">${R.map((r,i)=>`<option value="${i}">${r.n} Pack</option>`).join('')}<option value="7">Enhanced Godlike Pack</option></select><br><button style="margin-top:6px"></button>`;
 const sel=d.querySelector('select'),b=d.querySelector('button');sel.value=megaSel;
 const upd=()=>{b.textContent='Mega Open '+fmt(cost());b.disabled=S.coins<cost()};upd();
 sel.onchange=()=>{megaSel=+sel.value;upd()};b.onclick=()=>{if(S.coins>=cost())buy(megaSel,100)};$('ug').appendChild(d)}
function lockBox(){const d=document.createElement('div');d.className='box';d.innerHTML=`<b>Card Lock</b><small>Stops a card from being sold. You own ${S.locks||0}</small><button ${S.coins<LOCK?'disabled':''}>Buy ${fmt(LOCK)}</button>`;d.querySelector('button').onclick=()=>{if(S.coins<LOCK)return;S.coins-=LOCK;S.st.lockb++;S.locks=(S.locks||0)+1;save();render()};$('ug').appendChild(d)}
function squad(u){if((cardOf(u)||{}).err)return;if(S.sq.includes(u))S.sq=S.sq.filter(x=>x!=u);else if(S.sq.length<S.slots)S.sq.push(u);save();render()}
/* upgrades */
const cost={c:()=>Math.floor(25*3**S.u.c),a:()=>Math.floor(100*1.6**S.u.a),s:()=>Math.floor(500*4**(S.slots-3))};
function up(k){const c=cost[k]();if(S.coins<c||(k=='s'&&S.slots>=8))return;S.coins-=c;if(k=='c'){S.u.c++;S.click*=2}if(k=='a'){S.u.a++;S.auto++}if(k=='s')S.slots++;save();render()}
/* render */
let tab='p1',flt='all';
function render(){['p1','p2','p3','p4','p5','p6'].forEach(p=>$(p).classList.toggle('on',p==tab));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 if(tab=='p2')shop();if(tab=='p3')inv();if(tab=='p4')binder();if(tab=='p5')infoPage();if(tab=='p6')achPage()}
function shop(){const p=$('p2');p.innerHTML='<h3>Packs</h3><div class="row" id="pk"></div><h3>Upgrades</h3><div class="row" id="ug"></div>';
 for(let i=0;i<8;i++){const r=i==7?{n:'Enhanced Godlike',c:'#ffd54a'}:R[i],d=document.createElement('div');d.className='box';if(i>=6)d.style.boxShadow='0 0 18px #fff8';d.innerHTML=`<b style="color:${r.c}">${r.n} Pack</b><small>${i==7?'10 cards: all guaranteed Godlike':i==6?'1 card: guaranteed Godlike':'10 cards, all '+r.n}</small><button>Buy ${fmt(PRICE(i))}</button>${S.perk4?`<br><button style="margin-top:6px">Buy 4x ${fmt(PRICE(i)*4)}</button>`:''}`;const bs=d.querySelectorAll('button');bs[0].disabled=S.coins<PRICE(i);bs[0].onclick=()=>buy(i,1);if(bs[1]){bs[1].disabled=S.coins<PRICE(i)*4;bs[1].onclick=()=>buy(i,4)}$('pk').appendChild(d)}
 [['c',`Click Power (${fmt(S.click)}/click)`],['a',`Auto Clicker (${fmt(S.auto*S.click)}/s)`],['s',`Squad Slot (${S.slots}/8)`]].forEach(([k,n])=>{const d=document.createElement('div');d.className='box';d.innerHTML=`<b>${n}</b><small>${k=='c'?'Doubles money per click':k=='a'?'+1 auto click per second':'+1 squad slot'}</small><button ${S.coins<cost[k]()||(k=='s'&&S.slots>=8)?'disabled':''}>${k=='s'&&S.slots>=8?'Maxed':'Upgrade '+fmt(cost[k]())}</button>`;d.querySelector('button').onclick=()=>up(k);$('ug').appendChild(d)});perkBox();megaBox();lockBox()}
function perkBox(){const d=document.createElement('div');d.className='box';
 if(S.perk4)d.innerHTML='<b>4x Open (owned)</b><small>Use the 4x button under each pack</small>';
 else{d.innerHTML=`<b>4x Open perk</b><small>Adds a 4x buy button to every pack</small><button ${S.coins<PERK?'disabled':''}>Buy ${fmt(PERK)}</button>`;d.querySelector('button').onclick=()=>{if(S.coins<PERK)return;S.coins-=PERK;S.perk4=true;save();render()}}
 $('ug').appendChild(d)}
const TO={normal:0,silver:1,gold:2,ex:3,secret:4,genesis:5,cryptologic:6,singularity:7,jackpot:8},rr=c=>c.err?-1:BY[c.mid].ri,nm=c=>c.err?'':BY[c.mid].name;
const SORTS={val:['Value: high to low',(a,b)=>val(b)-val(a)],valup:['Value: low to high',(a,b)=>val(a)-val(b)],rar:['Rarity: high to low',(a,b)=>rr(b)-rr(a)||val(b)-val(a)],rarup:['Rarity: low to high',(a,b)=>rr(a)-rr(b)||val(a)-val(b)],type:['Card type',(a,b)=>TO[b.t]-TO[a.t]||(b.h|0)-(a.h|0)||val(b)-val(a)],holo:['Holo first',(a,b)=>(b.h|0)-(a.h|0)||val(b)-val(a)],newest:['Newest first',(a,b)=>b.uid-a.uid],name:['Name A to Z',(a,b)=>nm(a).localeCompare(nm(b))]};
let sortKey='val',invPage=0,rvPage=0;
const cmp=()=>{const f=SORTS[sortKey][1];return(a,b)=>(a.err?1:0)-(b.err?1:0)||f(a,b)};
function sortSel(cb){const l=document.createElement('label');l.textContent='Sort: ';const s=document.createElement('select');for(const k in SORTS)s.add(new Option(SORTS[k][0],k));s.value=sortKey;s.onchange=()=>{sortKey=s.value;cb()};l.appendChild(s);return l}
function pager(pc,pg,go){const d=document.createElement('span');d.style.marginLeft='10px';const a=document.createElement('button'),b=document.createElement('button');a.textContent='Prev';b.textContent='Next';a.disabled=pg<=0;b.disabled=pg>=pc-1;a.onclick=()=>go(pg-1);b.onclick=()=>go(pg+1);d.append(a,` Page ${pg+1} of ${pc} `,b);return d}
function inv(){const p=$('p3');p.innerHTML=`<h3>Squad (${S.sq.length}/${S.slots}) - earns ${fmt(idle())}/s</h3><button id="sb">Squad best</button><div class="cards" id="sq" style="margin-top:10px"></div><h3>Cards (${S.cards.length}) - Locks owned: ${S.locks||0}</h3><select id="fl"><option value="all">All rarities</option>${R.map(r=>`<option value="${r.k}">${r.n}</option>`).join('')}</select> <button id="sa">Sell all in this filter (keeps Squad and locked)</button><div id="ic" style="margin:10px 0"></div><div class="cards" id="ca"></div><div id="ib" style="margin-top:12px"></div>`;
 $('sb').onclick=squadBest;$('fl').value=flt;$('fl').onchange=e=>{flt=e.target.value;invPage=0;inv()};
 S.sq.forEach(u=>{const c=cardOf(u);if(c){const w=document.createElement('div');w.appendChild(card(c));const b=document.createElement('button');b.textContent='Remove';b.onclick=()=>squad(u);w.appendChild(b);$('sq').appendChild(w)}});
 const list=S.cards.filter(c=>flt=='all'||c.mid.startsWith(flt+'_')).sort(cmp()),pc=Math.max(1,Math.ceil(list.length/40));invPage=Math.min(invPage,pc-1);const go=n=>{invPage=n;inv()};
 $('ic').append(sortSel(()=>{invPage=0;inv()}),pager(pc,invPage,go));$('ib').appendChild(pager(pc,invPage,go));
 $('sa').onclick=()=>{const t=list.filter(c=>!S.sq.includes(c.uid)&&!c.lk&&!c.err);if(t.length&&confirm(`Sell ${t.length} cards?`)){t.forEach(c=>sell(c.uid,1));save();render()}};
 list.slice(invPage*40,invPage*40+40).forEach(c=>{const w=document.createElement('div');w.appendChild(card(c));if(c.err){$('ca').appendChild(w);return}const a=document.createElement('button');a.textContent='Sell';a.disabled=!!c.lk;a.onclick=()=>sell(c.uid);const b=document.createElement('button');b.textContent=S.sq.includes(c.uid)?'Unsquad':'Squad';b.onclick=()=>squad(c.uid);const l=document.createElement('button');l.textContent=c.lk?'Unlock':'Lock';l.disabled=!c.lk&&!(S.locks>0);l.title=l.disabled?'Buy locks in the Shop':'';l.onclick=()=>c.lk?unlock(c.uid):lock(c.uid);w.append(a,' ',b,' ',l);$('ca').appendChild(w)})}
function infoPage(){const row=(...a)=>'<tr>'+a.map(x=>'<td style="padding:3px 12px 3px 0">'+x+'</td>').join('')+'</tr>',tb=(h,r)=>'<h3>'+h+'</h3><table style="border-collapse:collapse">'+r.join('')+'</table>',one=w=>'1 in '+Math.round(100/w).toLocaleString(),B=x=>'<b>'+x+'</b>';
 $('p5').innerHTML=tb('Card types (rolled per card)',[row(B('Type'),B('Chance'),B('Odds'),B('Value'))].concat(Object.keys(T).map(k=>row(k,+T[k].w.toFixed(3)+'%',one(T[k].w),'x'+T[k].m.toLocaleString())),[row('holo (any type)','20%','1 in 5','x10, stacks with type')]))
 +tb('Rarity tiers (set by the pack)',[row(B('Rarity'),B('Monsters'),B('Base value'),B('Pack price'),B('Godlike chance per pack'))].concat(R.map((r,i)=>row(r.n,r.n_,fmt(r.v),fmt(PRICE(i)),i<6?'1 in '+Math.round(1/r.g).toLocaleString():'-'))))
 +tb('Special packs and items',[row('Godlike Pack',fmt(PRICE(6)),'1 guaranteed godlike'),row('Enhanced Godlike Pack',fmt(PRICE(7)),'10 guaranteed godlikes'),row('4x Open perk',fmt(PERK),'open 4 packs at once'),row('Mega Open','pack price x100 +10%','100 packs at once'),row('Card Lock',fmt(LOCK),'blocks selling')])
 +tb('Other',[row('Error card','1 in 4,040 packs','$0, cannot sell, squad, or lock'),row('Card value','base x type x holo','selling pays full value'),row('Squad idle income','0.5% of card value per second','per squad card')])}
let bt='any',bh='any',bs='all';const TYPES=Object.keys(T);
function got(id){if(bt=='any'&&bh=='any')return !!S.seen[id];for(const t of TYPES){if(bt!='any'&&t!=bt)continue;for(const h of[0,1]){if(bh=='holo'&&!h||bh=='plain'&&h)continue;if(S.vars[id+'|'+t+(h?'h':'')])return true}}return false}
function binder(){const p=$('p4'),tot=MON.length*TYPES.length*2,have=Object.keys(S.vars).length,cnt={};Object.keys(S.vars).forEach(k=>{const q=k.split('|')[1],h=q.slice(-1)=='h';let t=q;if(h)t=q.slice(0,-1);const a=cnt[t]||(cnt[t]=[0,0]);a[h?1:0]++});
 const sel=(id,opts,v)=>`<select id="${id}">${opts.map(o=>`<option value="${o[0]}"${o[0]==v?' selected':''}>${o[1]}</option>`).join('')}</select>`;
 p.innerHTML=`<h3>Dex: ${Object.keys(S.seen).length}/${MON.length} discovered | Master set: ${have}/${tot} (${(have/tot*100).toFixed(1)}%)</h3>
 <div style="margin-bottom:8px">Type ${sel('bt',[['any','Any type']].concat(TYPES.map(t=>[t,t])),bt)} Holo ${sel('bh',[['any','Any'],['holo','Holo only'],['plain','Non-holo only']],bh)} Show ${sel('bs',[['all','All'],['have','Collected'],['missing','Missing']],bs)}</div>
 <table style="border-collapse:collapse;margin-bottom:10px">${TYPES.map(t=>`<tr><td style="padding:2px 12px 2px 0">${t}</td><td style="padding:2px 12px 2px 0">${(cnt[t]||[0,0])[0]}/${MON.length}</td><td>holo ${(cnt[t]||[0,0])[1]}/${MON.length}</td></tr>`).join('')}</table>
 <p style="color:var(--mu)">Master set counts every monster in every type, with and without holo. Cards you sold before this update are only counted if you still own them.</p>`;
 ['bt','bh','bs'].forEach(id=>$(id).onchange=e=>{({bt:()=>bt=e.target.value,bh:()=>bh=e.target.value,bs:()=>bs=e.target.value})[id]();binder()});
 R.forEach((r,ri)=>{const ms=MON.filter(m=>m.ri==ri),own=ms.filter(m=>got(m.id)).length;p.insertAdjacentHTML('beforeend',`<h4 style="color:${r.c}">${r.n} ${own}/${r.n_}</h4><div class="cards" id="b${ri}"></div>`);
  ms.forEach(m=>{const ok=got(m.id);if(bs=='have'&&!ok||bs=='missing'&&ok)return;const d=document.createElement('div');d.className='card mini'+(ok?'':' no');d.style.setProperty('--rc',r.c);d.innerHTML=`<canvas width="40" height="40"></canvas><b>${m.name}</b>`;draw(d.querySelector('canvas'),m,bt=='any'?'normal':bt);$('b'+ri).appendChild(d)})})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('crystal').onclick=e=>{S.coins+=S.click;S.st.clicks++;chk();const f=document.createElement('div');f.className='fl';f.textContent='+'+fmt(S.click);f.style.left=e.clientX-10+'px';f.style.top=e.clientY-20+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),800)};
let n=0;setInterval(()=>{S.coins+=(idle()+S.auto*S.click)/10;$('co').textContent=fmt(S.coins);$('id').textContent=fmt(idle());$('au').textContent=fmt(S.auto*S.click);n++;if(n%50==0&&tab=='p2'&&document.activeElement.id!='mgs')shop();if(n%10==0){chk();if(tab=='p6')achPage()}if(n%100==0)save()},100);
addEventListener('pagehide',save);addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
render();
</script></body></html>
